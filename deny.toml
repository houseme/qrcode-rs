# cargo-deny policy for the complete workspace dependency graph.
# Keep this file deliberately conservative: new registries, git dependencies,
# yanked releases, and wildcard requirements require an explicit review.

[graph]
all-features = true
targets = []

[advisories]
version = 2
unmaintained = "workspace"
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "OpenSSL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
