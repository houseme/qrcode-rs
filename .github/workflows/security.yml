name: Supply-chain security

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check dependency policy
        run: cargo deny check

  cargo-vet:
    name: cargo vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-vet
      - name: Verify the locked audit store
        run: cargo vet --locked

  minimal-feature:
    name: Minimal feature dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the dependency-free facade
        run: cargo check --locked --no-default-features --features minimal
      - name: Assert no registry dependencies are selected
        shell: python
        run: |
          import json
          import pathlib
          import subprocess

          metadata = json.loads(subprocess.check_output([
              "cargo", "metadata", "--locked", "--no-deps", "--format-version", "1",
          ], text=True))
          members = set(metadata["workspace_members"])
          allowed = {
              f'{package["name"]} v{package["version"]} ({pathlib.Path(package["manifest_path"]).parent})'
              for package in metadata["packages"] if package["id"] in members
          }
          tree = subprocess.check_output([
              "cargo", "tree", "--locked", "-p", "qrcode-rs",
              "--no-default-features", "--features", "minimal", "--edges", "normal",
              "--prefix", "none", "--format", "{p}",
          ], text=True)
          unexpected = {line.removesuffix(" (*)") for line in tree.splitlines()} - allowed
          if unexpected:
              raise SystemExit(f"minimal selected non-workspace dependencies: {sorted(unexpected)}")
