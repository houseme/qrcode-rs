name: Release supply chain

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  artifacts:
    name: Package, SBOM, and attest release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable
      # cosign v3 changed `sign-blob` keyless output to bundle-only format, which
      # would drop the .sig/.pem artifacts verified via `cosign verify-blob
      # --signature/--certificate` in README. Pin 2.x until the verification flow
      # migrates to bundles.
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: "v2.6.5"

      - name: Wait for crates.io index
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          crates=(
            qrcode-core
            qrcode-render
            qrcode-image
            qrcode-parse
            qrcode-decode
            qrcode-svg
            qrcode-eps
            qrcode-pic
            qrcode-html
            qrcode-pdf
            qrcode-rs
          )

          wait_for_crate() {
            local crate="$1"
            local version="$2"

            for attempt in {1..80}; do
              if cargo info "${crate}@${version}" --registry crates-io >/dev/null 2>&1; then
                echo "${crate} ${version} is visible in the crates.io index"
                return 0
              fi

              echo "waiting for ${crate} ${version} in crates.io index (${attempt}/80)"
              sleep 30
            done

            echo "${crate} ${version} was not visible in the crates.io index in time" >&2
            return 1
          }

          for crate in "${crates[@]}"; do
            wait_for_crate "${crate}" "${version}"
          done

      - name: Package publishable crates
        shell: bash
        run: |
          set -euo pipefail
          cargo package --workspace --locked --no-verify --allow-dirty --registry crates-io
          mkdir -p dist
          cp target/package/*.crate dist/
          test "$(find dist -maxdepth 1 -name '*.crate' | wc -l)" -gt 0

      - name: Generate CycloneDX SBOMs
        shell: bash
        run: |
          set -euo pipefail
          cargo cyclonedx --all-features --format json
          mkdir -p dist/sbom
          found=0
          while IFS= read -r -d '' bom; do
            found=1
            package_name="$(basename "$bom" .cdx.json)"
            cp "$bom" "dist/sbom/${package_name}.cdx.json"
          done < <(find . -name '*.cdx.json' -not -path './dist/*' -print0)
          test "$found" -eq 1
          tar -czf "dist/qrcode-rs-${GITHUB_REF_NAME}-sbom.tar.gz" -C dist sbom

      - name: Build auditable CLI binary
        run: |
          cargo auditable build --locked --release -p qrcode-cli
          tar -czf "dist/qrcode-rs-${GITHUB_REF_NAME}-cli-linux-x86_64.tar.gz" \
            -C target/release qrencodes

      - name: Sign release artifacts with Sigstore
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for artifact in dist/*.crate dist/*.tar.gz; do
            cosign sign-blob --yes \
              --output-signature "${artifact}.sig" \
              --output-certificate "${artifact}.pem" \
              "$artifact"
          done

      - name: Attest packaged crates
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*.crate"

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.crate
            dist/*.tar.gz
            dist/*.sig
            dist/*.pem
