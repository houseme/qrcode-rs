[package]
name = "qrcode-image"
description = "Image rendering backend and image helpers for qrcode-rs."
license = "MIT OR Apache-2.0"
version = "2.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["houseme <housemecn@gmail.com>"]
repository = "https://github.com/houseme/qrcode-rs"
keywords = ["qrcode", "image", "png", "jpeg", "renderer"]
categories = ["encoding", "multimedia::images"]
readme = "README.md"

[dependencies]
image = { version = "0.25.10", default-features = false, optional = true }
qrcode-core = { path = "../qrcode-core", version = "2.1.0", default-features = false }
qrcode-render = { path = "../qrcode-render", version = "2.1.0", default-features = false }

[features]
default = []
# Links the standard library. Disabled by default to preserve qrcode-render's
# no_std + alloc feature shape.
std = ["qrcode-core/std", "qrcode-render/std"]
# Enables image-backed pixels and PNG/JPEG helper functions.
image = ["std", "dep:image", "image/png", "image/jpeg", "qrcode-render/image"]
