[package]
name = "qrcode-html"
description = "Pure Rust HTML table and CSS-grid rendering backend for qrcode-rs."
license = "MIT OR Apache-2.0"
version.workspace = true
edition = "2024"
rust-version = "1.85"
authors = ["houseme <housemecn@gmail.com>"]
repository = "https://github.com/houseme/qrcode-rs"
keywords = ["qrcode", "html", "renderer", "no-std"]
categories = ["encoding", "multimedia::images", "no-std"]
readme = "README.md"

[dependencies]
qrcode-core = { workspace = true }
qrcode-render = { workspace = true }

[features]
default = []
# Links the `std` crate. Disable for `no_std` + `alloc`.
std = ["qrcode-core/std", "qrcode-render/std"]
