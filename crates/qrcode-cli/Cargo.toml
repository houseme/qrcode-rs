[package]
name = "qrcode-cli"
description = "Command-line QR code generator for qrcode-rs."
license = "MIT OR Apache-2.0"
version.workspace = true
edition = "2024"
rust-version = "1.85"
authors = ["houseme <housemecn@gmail.com>"]
repository = "https://github.com/houseme/qrcode-rs"
keywords = ["qrcode", "cli", "qrencodes", "encoder"]
categories = ["command-line-utilities", "encoding"]
readme = "README.md"

[dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
qrcode-rs = { workspace = true, features = ["std"] }
qrcode-render = { workspace = true, features = ["std"] }
qrcode-image = { workspace = true, features = ["image"] }
qrcode-svg = { workspace = true, features = ["std"] }
qrcode-eps = { workspace = true, features = ["std"] }
qrcode-pic = { workspace = true, features = ["std"] }
qrcode-html = { workspace = true, features = ["std"] }
qrcode-pdf = { workspace = true, features = ["std"] }

[[bin]]
name = "qrencodes"
path = "src/main.rs"
