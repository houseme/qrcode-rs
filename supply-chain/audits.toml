who = "OpenAI Codex (AI-assisted published-source review)"
criteria = "safe-to-deploy"
version = "0.4.12"
notes = """
The reviewed published crate archive matches the locked Cargo checksum. Reviewed all shipping modules, metadata and unsafe sites. get_disjoint_mut validates all duplicate pairs before references, checks actual Vec length before pointer arithmetic, initializes each MaybeUninit slot exactly once and only assumes initialization after complete success. Explicit unchecked APIs retain documented in-bounds/distinct-key obligations. Reviewed removal/drain/compaction guards and iteration ownership; panic-catching users with panicking Clone/Drop may observe stale logical metadata, but safe raw-reference paths still check actual storage. Sparse collection and optional serde require caller-bounded keys/size hints as documented; ordinary insertion allocates internal sequential keys. No build script or ambient filesystem/network/process operations. Source-only review.
