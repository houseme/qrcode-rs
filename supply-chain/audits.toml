notes = """
Compared the published source delta and verified the archive checksum against Cargo.lock. ignore_to_value_close now returns the closing token's span instead of emitting array_close/inline_table_close itself, letting on_array_open/on_inline_table_open emit the close only for a declined-but-matched value and report an error span on malformed paths; this restores EventReceiver open/close balance so the RecursionGuard depth counter no longer leaks after a recursion-limited nested array or inline table, which previously caused later valid nesting to be spuriously rejected. Ten new tests assert the final guard depth across matched-close, EOF, unexpected-token, key and comma states. All changes are safe code with no unsafe blocks and no dependency changes. Published-source delta review; the new tests were not run locally and the depth accounting was verified by reading the receiver contract rather than fuzzing.
"""

