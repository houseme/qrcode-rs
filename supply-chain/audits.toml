
# cargo-vet audits file

[criteria.qrcode-rs-review]
description = "qrcode-rs maintainers reviewed the dependency for the release policy in effect."

[[audits.aho-corasick]]
who = "OpenAI Codex (AI-assisted published-source review)"
criteria = "safe-to-deploy"
version = "1.1.5"
notes = """
The reviewed published crate archive matches the locked Cargo checksum. Reviewed all active unsafe families and their safe entry contracts, plus package capability metadata. Checked haystack spans, short-input fallback, CPU-feature/endianness dispatch before SSSE3/AVX2/NEON, minimum read spans, all Slim/Fat 1-4 mask pointer loops, bounded final overlapping loads and bucket verification. Checked prefix comparisons against remaining slice length, fixed vector representations, sealed Automaton contracts and representable premultiplied state IDs. Huge caller pattern collections require caller resource bounds. No build script or own filesystem/network/process/environment capability. This is an unsafe/capability source review, not every matching-semantic branch or a platform benchmark.
"""

[[audits.android_system_properties]]
who = "OpenAI Codex (AI-assisted published-source review)"
criteria = "safe-to-deploy"
version = "0.1.6"
notes = """
The reviewed published crate archive matches the locked Cargo checksum. Reviewed the complete published Rust implementation and package metadata. Checked fixed RTLD_NOLOAD libc lookup, fixed symbol names, retained handle ownership, immutable thread-safe function pointers, synchronous callback storage, invalid UTF-8 returning None without unwinding through C, CString validation, null property handling and the PROP_VALUE_MAX-sized legacy buffer before set_len. No build script, setter, network or subprocess capability. Assumes the native Android API honors its synchronous callback and buffer contracts; no Android runtime test performed.
"""

[[audits.arbitrary]]
who = "OpenAI Codex (AI-assisted published-source delta review)"
criteria = "safe-to-deploy"
delta = "1.4.2 -> 1.5.0"
notes = """
Compared the published source delta and verified the 1.5.0 archive checksum against Cargo.lock. Reviewed the changed fixed-array builder: the stack MaybeUninit allocation remains live under its guard, each pointer is within 0..N, and the initialized count advances only after ptr::write; error/panic drops only the initialized prefix. The UTF-8 path consumes only valid_up_to bytes, CString removes all NUL bytes before unchecked construction, and nonzero integer generation now substitutes MAX for zero (a distribution change, not a memory-safety path). No build script or filesystem/network/process/FFI capability. Package unit tests were unavailable because the offline cache lacks exhaustigen; this is a source-delta review, not a full behavior proof.
"""

[[audits.bit-set]]
who = "OpenAI Codex (AI-assisted published-source delta review)"
criteria = "safe-to-run"
delta = "0.8.0 -> 0.11.1"
notes = """
Compared the published source delta and verified the archive checksum. Reviewed the bit-set operations that mutate the backing BitVec through its unsafe invariant-only accessors: they preserve storage length, mask unused trailing bits, and shrink only by complete zero blocks before updating logical length. The 0.11 line removes nanoserde support and includes the upstream deserialization soundness fix carried by bit-vec 0.10.0; no deserialize path bypasses the backing length/trailing-bit validation in bit-vec 0.10.1. No build script or own filesystem/network/process capability. Optional serialization paths were inspected but their dependency feature tests were not run locally.
"""

[[audits.bit-vec]]
who = "OpenAI Codex (AI-assisted published-source delta review)"
criteria = "safe-to-run"
delta = "0.8.0 -> 0.10.1"
notes = """
Compared published sources and verified the archive checksum. Reviewed the public unsafe storage mutation contract and unchecked bit access preconditions. Serde/Borsh/miniserde deserializers first read an unchecked representation, then reject mismatched block counts and set trailing bits before returning a BitVec; the optional Borsh/serde features are separately declared. Directly compiled and ran the dependency-free upstream unit suite: 59 passed. Cargo-based optional-feature tests could not resolve miniserde from the offline cache, so those feature integrations were source-reviewed but not executed.
"""

[[audits.borsh]]
who = "OpenAI Codex (AI-assisted published-source review)"
criteria = "safe-to-run"
version = "1.8.1"
notes = """
Verified the registry archive checksum. Reviewed the package manifest and build.rs (it only emits a cfg alias from declared features), and the two unsafe array-deserialization sites. The guard drops exactly the prefix whose initialization count is advanced only after writing; conversion to [T; N] occurs only after all N writes succeed and disables the guard before moving the array. Borsh serialization/deserialization can allocate in proportion to encoded lengths, so callers must bound hostile inputs. No own network, process, filesystem, or FFI capability. No Borsh-specific upstream tests were run locally.
"""

