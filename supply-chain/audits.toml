
# cargo-vet audits file

[criteria.qrcode-rs-review]
description = "qrcode-rs maintainers reviewed the dependency for the release policy in effect."

[[audits.aho-corasick]]
who = "OpenAI Codex (AI-assisted published-source review)"
criteria = "safe-to-deploy"
version = "1.1.5"
notes = """
The reviewed published crate archive matches the locked Cargo checksum. Reviewed all active unsafe families and their safe entry contracts, plus package capability metadata. Checked haystack spans, short-input fallback, CPU-feature/endianness dispatch before SSSE3/AVX2/NEON, minimum read spans, all Slim/Fat 1-4 mask pointer loops, bounded final overlapping loads and bucket verification. Checked prefix comparisons against remaining slice length, fixed vector representations, sealed Automaton contracts and representable premultiplied state IDs. Huge caller pattern collections require caller resource bounds. No build script or own filesystem/network/process/environment capability. This is an unsafe/capability source review, not every matching-semantic branch or a platform benchmark.
"""

[[audits.android_system_properties]]
who = "OpenAI Codex (AI-assisted published-source review)"
criteria = "safe-to-deploy"
version = "0.1.6"
notes = """
The reviewed published crate archive matches the locked Cargo checksum. Reviewed the complete published Rust implementation and package metadata. Checked fixed RTLD_NOLOAD libc lookup, fixed symbol names, retained handle ownership, immutable thread-safe function pointers, synchronous callback storage, invalid UTF-8 returning None without unwinding through C, CString validation, null property handling and the PROP_VALUE_MAX-sized legacy buffer before set_len. No build script, setter, network or subprocess capability. Assumes the native Android API honors its synchronous callback and buffer contracts; no Android runtime test performed.
