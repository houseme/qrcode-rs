[[audits.bumpalo]]
who = "GLM (AI-assisted published-source delta review)"
criteria = "safe-to-deploy"
delta = "3.20.3 -> 3.20.4"
notes = """
Compared the published source delta and verified the archive checksum against Cargo.lock. This release fixes GHSA-j7wg-xg3h-2pr6: zero-sized allocations now early-return a dangling pointer from a new helper (NonNull at address align, a debug-asserted power of two, hence non-null and correctly aligned) instead of bumping the chunk footer, which could race on the shared EMPTY_CHUNK across threads. Reviewed the accompanying grow-path change: when the size delta is zero the original pointer is returned unchanged, preserving pointer identity and preventing a copy into the dangling pointer. The new unsafe code is confined to the helper with a sound power-of-two precondition; no dependency changes or new capabilities. Published-source delta review; upstream and miri test suites were not run locally; not an exhaustive semantic audit of the allocator.
"""

